name: Build APK

on:
  push:
    branches: [main]
    # The page is bundled into the APK, so a page change is an APK change.
    paths: ['android/**', 'src/**', 'build.py', 'data/inventory_raw.csv',
            'data/form_responses.csv', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the page and bundle it into the APK. The snapshot baked in here is
      # only the first paint — the page fetches the live sheet right after boot.
      - name: Build index.html and bundle it as an asset
        run: |
          python3 build.py
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          ls -la android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships an Android SDK; this accepts the licences and
      # makes sure the platform this project compiles against is present.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        id: name
        run: |
          v=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Fixed filename on purpose: gh release upload --clobber only replaces
          # an asset with the SAME name. A name that varied per run (it used to
          # include GITHUB_RUN_NUMBER) meant every push added a new asset instead
          # of replacing one, and the release silently accumulated stale APKs.
          echo "file=box-inventory.apk" >> "$GITHUB_OUTPUT"

      # Deliberately NOT actions/upload-artifact: this account's Actions artifact
      # storage is full, and an artifact is a zip Android cannot install anyway.
      # A release asset is a direct .apk link and does not touch that quota.
      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.name.outputs.file }}"
          # Delete-then-create raced with its own tag: --cleanup-tag left the tag
          # behind, so create failed with "tag_name already exists" while the run
          # still looked half-successful. Ensure the release exists, then upload
          # over it — upload --clobber is idempotent.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest APK" --notes "Rolling debug build."
          gh release upload latest "${{ steps.name.outputs.file }}" --clobber
          gh release edit latest \
            --notes "Debug build of commit ${GITHUB_SHA:0:7} (v${{ steps.name.outputs.version }}, run ${GITHUB_RUN_NUMBER}). Install on the phone, then set the server address from the menu."
