name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships an Android SDK; this accepts the licences and
      # makes sure the platform this project compiles against is present.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        id: name
        run: echo "file=box-inventory-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"

      # Deliberately NOT actions/upload-artifact: this account's Actions artifact
      # storage is full, and an artifact is a zip Android cannot install anyway.
      # A release asset is a direct .apk link and does not touch that quota.
      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.name.outputs.file }}"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.name.outputs.file }}" \
            --title "Latest APK" \
            --notes "Debug build of commit ${GITHUB_SHA:0:7}. Install on the phone, then set the server address from the menu."
