plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arnodaamen.boxinventory'
    compileSdk 35

    defaultConfig {
        applicationId "com.arnodaamen.boxinventory"
        // 29 = Android 10. Above that, MediaStore takes a photo without needing
        // WRITE_EXTERNAL_STORAGE, which keeps the app permission-free.
        minSdk 29
        // 34, not 35, on purpose. Targeting 35 makes Android 15 force edge-to-edge,
        // so the WebView draws under the status bar and the camera cutout hid the
        // app's header. At 34 the system lays out the status bar normally.
        // The page also pads itself with env(safe-area-inset-*) for browsers that
        // go edge-to-edge regardless.
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        debug {
            // The workflow ships the debug build: it is signed with the standard
            // debug key, so it installs from a file without a Play account.
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose — the framework WebView is all this needs, and an
// empty dependency graph is one less thing that can break the CI build.
dependencies {
}
