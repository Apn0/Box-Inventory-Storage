<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box Inventory</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#eef1f5; --line:#d8dee7;
  --ink:#141821; --ink-2:#5b6675; --ink-3:#8a93a2;
  --accent:#1d5cff; --accent-ink:#ffffff;
  --ok:#0f8a4d; --warn:#b06f00; --bad:#c0392b; --bulk:#6b4fc9;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --panel:#161b24; --panel-2:#1e2530; --line:#2b3442;
    --ink:#e8ecf3; --ink-2:#a4b0c0; --ink-3:#71809a;
    --accent:#5b8cff; --accent-ink:#0b0f16;
    --ok:#3fbf7f; --warn:#e0a33a; --bad:#ff6b5e; --bulk:#a48bff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b24; --panel-2:#1e2530; --line:#2b3442;
  --ink:#e8ecf3; --ink-2:#a4b0c0; --ink-3:#71809a;
  --accent:#5b8cff; --accent-ink:#0b0f16;
  --ok:#3fbf7f; --warn:#e0a33a; --bad:#ff6b5e; --bulk:#a48bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------------------------------------------------------------- layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 12px 72px}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  /* Phones draw the page under the status bar and the camera cutout when the
     app runs edge-to-edge (Android 15, and Chrome in standalone mode), which
     hid the stats line behind the punch-hole. */
  padding:calc(10px + env(safe-area-inset-top)) 0 8px;
  border-bottom:1px solid var(--line);
}
.wrap{padding-left:max(12px, env(safe-area-inset-left));
      padding-right:max(12px, env(safe-area-inset-right))}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.titlerow h1{font-size:17px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.titlerow .spacer{flex:1}
.iconbtn{
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
  padding:6px 10px; font-size:13px; color:var(--ink-2);
}
.iconbtn:hover{border-color:var(--accent);color:var(--ink)}

.searchrow{display:flex;gap:8px}
#q{
  flex:1; padding:11px 13px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); font-size:16px; box-shadow:var(--shadow);
}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.clearq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px}

nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:6px 11px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
nav.tabs .badge{
  display:inline-block;min-width:17px;margin-left:5px;padding:0 5px;
  background:var(--bad);color:#fff;border-radius:9px;font-size:11px;font-weight:700;text-align:center
}

/* ---------------------------------------------------------------- chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.chip{
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:12.5px;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}

.hint{color:var(--ink-3);font-size:12.5px;margin:8px 2px}

/* ---------------------------------------------------------------- items */
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.item{display:flex;flex-wrap:wrap;align-items:stretch}
.item>.row{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;flex:1;min-width:0;
  background:none;border:0;text-align:left}
.item>.editor{width:100%}
.boxno{
  flex:none;min-width:46px;height:40px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line); display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono); line-height:1;
}
.boxno b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.boxno span{font-size:8.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.itemmain{flex:1;min-width:0}
.itemname{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.itemmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--ink-2)}
.tag{background:var(--panel-2);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.tag.flag{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:600}
.tag.err{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);font-weight:600}
.note{color:var(--ink-3);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.qty{
  flex:none;min-width:52px;text-align:right;font-family:var(--mono);
  font-size:17px;font-weight:700;letter-spacing:-.02em;
}
.qty small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-family:var(--sans)}
.qty.bulk{color:var(--bulk)} .qty.unknown{color:var(--ink-3)} .qty.zero{color:var(--bad)}

/* take one out / put one back, straight from the list */
.tally{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 10px 6px 0;
  justify-content:center}
.tally button{width:40px;height:32px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--line);font-size:17px;font-weight:700;line-height:1;color:var(--ink-2)}
.tally button:active{background:var(--accent);color:var(--accent-ink)}
.tally button:disabled{opacity:.3}
.item.low .boxno{border-color:var(--warn)}
.item.low .qty{color:var(--warn)}
#undobar{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));
  z-index:45;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:13.5px}
#undobar b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#undobar button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;
  padding:7px 14px;font-weight:700;font-size:13px}

/* editor */
.editor{border-top:1px dashed var(--line);padding:11px 12px;background:var(--panel-2)}
.eline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.eline label{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;min-width:62px}
.editor input,.editor select,.editor textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px
}
.editor input[type=number]{width:78px;font-family:var(--mono)}
.editor .grow{flex:1;min-width:150px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:17px;font-weight:700;line-height:1}
.ebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:var(--panel);color:var(--bad);border:1px solid var(--bad)}
.hist{margin-top:9px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.hist div{padding:1px 0}

/* ---------------------------------------------------------------- boxes */
.container-h{margin:18px 0 7px;font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.boxcell{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 4px;
  text-align:center;font-family:var(--mono);position:relative
}
.boxcell b{display:block;font-size:15px;font-weight:700}
.boxcell span{display:block;font-size:10px;color:var(--ink-3);font-family:var(--sans);margin-top:2px}
.boxcell.free{border-style:dashed;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.boxcell.free span{color:var(--ok);font-weight:700}
.boxcell.hit{outline:2px solid var(--accent)}
.boxcell:hover{border-color:var(--accent)}

/* ---------------------------------------------------------------- panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-top:10px}
.panel h2{margin:0 0 4px;font-size:14.5px}
.panel h2 .count{color:var(--ink-3);font-weight:500;font-size:13px}
.panel p.sub{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:3px 0;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px}
.kv b{font-family:var(--mono);font-weight:700;text-align:right}
textarea.bom{width:100%;min-height:130px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:10px;font-family:var(--mono);font-size:13px;resize:vertical}
.bomrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.bomrow:first-child{border-top:0}
.bomq{flex:none;font-family:var(--mono);font-weight:700;min-width:34px}
.bomhit{flex:1;min-width:0;font-size:13.5px}
.bomhit .alt{color:var(--ink-3);font-size:12px}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;font-family:var(--sans)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.maybe{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* camera — only rendered when served over http (i.e. from the phone) */
#cam{
  position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:40; width:64px; height:64px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); border:0; font-size:26px;
  box-shadow:0 4px 16px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
}
/* Beside the camera, not above it: stacked, it sat where a toast or the
   keyboard could cover it, and it read as part of the page rather than a
   control. Side by side, both are always on screen together. */
#gal{
  position:fixed; right:92px; bottom:calc(23px + env(safe-area-inset-bottom));
  z-index:40; width:50px; height:50px; border-radius:50%;
  background:var(--panel); color:var(--ink-2); border:1px solid var(--line); font-size:21px;
  box-shadow:0 2px 10px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
}
#cam:active,#gal:active{transform:scale(.94)}
#cam[data-busy="1"],#gal[data-busy="1"]{opacity:.55}
#cam .n{
  position:absolute; top:-3px; right:-3px; min-width:21px; height:21px; padding:0 5px;
  background:var(--warn); color:#fff; border-radius:11px; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center; font-family:var(--sans);
}
/* ranked to-do cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;margin-top:9px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink-3)}
.card.now::before{background:var(--bad)}
.card.soon::before{background:var(--warn)}
.card.later::before{background:var(--ok)}
.card h3{margin:0 0 3px;font-size:15px;letter-spacing:-.01em}
.card .why{margin:0 0 9px;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.cardtop{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.cardtop .when{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card.now .cardtop .when{color:var(--bad)}
.card.soon .cardtop .when{color:var(--warn)}
.card.later .cardtop .when{color:var(--ok)}
.cardtop .effort{margin-left:auto;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.card ul.targets{margin:0 0 10px;padding:0;list-style:none}
.card ul.targets li{padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.card ul.targets li:first-child{border-top:0}
.card ul.targets a{text-decoration:none}
.card .more{background:none;border:0;color:var(--ink-3);font-size:12.5px;padding:2px 0}
.donebar{text-align:center;color:var(--ink-3);font-size:13px;padding:20px 12px 4px}

/* count confirmation */
#sheetwrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
  width:100%;max-width:520px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(0,0,0,.4);max-height:92vh;overflow:auto}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sheet .shot{width:100%;max-height:34vh;object-fit:contain;border-radius:10px;
  background:var(--panel-2);margin-bottom:12px}
#sheet h2{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}
#sheet .sub2{margin:0 0 12px;color:var(--ink-2);font-size:13px}
#sheet .ask{font-size:14px;font-weight:600;margin:0 0 8px}
.counter{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.counter button{width:52px;height:52px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--line);font-size:24px;font-weight:700;line-height:1}
.counter input{flex:1;min-width:0;height:52px;text-align:center;font-size:26px;
  font-weight:700;font-family:var(--mono);border-radius:12px;border:1px solid var(--line);
  background:var(--panel-2)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.quick button{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;
  padding:7px 12px;font-size:13px;color:var(--ink-2)}
.quick button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
#sheet .row2{display:flex;gap:8px}
#sheet .row2 .btn{flex:1}
#sheet .wrongname{width:100%;margin-bottom:10px;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel-2);font-size:14px}
#sheet .queued{text-align:center;color:var(--ink-3);font-size:12px;margin-top:10px}

/* typed / spoken entry */
#say{
  position:fixed; right:168px; bottom:calc(23px + env(safe-area-inset-bottom));
  z-index:40; width:50px; height:50px; border-radius:50%;
  background:var(--panel); color:var(--ink-2); border:1px solid var(--line); font-size:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
}
#say:active{transform:scale(.94)}
#say.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.namerow{display:flex;gap:8px;margin-bottom:10px}
.namerow input{flex:1;min-width:0;padding:12px 12px;font-size:16px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2)}
.namerow button{width:52px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);font-size:20px}
.namerow button.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.matches{margin:0 0 12px;padding:0;list-style:none;max-height:44vh;overflow:auto}
.matches li{border-top:1px solid var(--line)}
.matches li:first-child{border-top:0}
.matches button{width:100%;text-align:left;background:none;border:0;padding:10px 2px;
  display:flex;gap:10px;align-items:baseline}
.matches .nm{flex:1;font-size:14.5px}
.matches .bx{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.matches .qt{font-family:var(--mono);font-weight:700;font-size:14px}
.heard{font-size:12.5px;color:var(--ink-3);min-height:17px;margin:-4px 0 8px}

/* voice mode banner */
#vbanner{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.3);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px}
#vbanner .vtext{flex:1;font-size:15px;font-weight:600;line-height:1.35}
#vbanner .vsub{position:absolute;left:16px;bottom:calc(4px + env(safe-area-inset-bottom));
  font-size:11.5px;color:var(--ink-3)}
#vbanner button{background:var(--bad);color:#fff;border:0;border-radius:10px;
  padding:10px 16px;font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--ink-3);padding:38px 12px;font-size:14px}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .18s
}
.toast.show{opacity:1}

/* ---------------------------------------------------------------- labels */
.labelsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.label{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:var(--panel);
  min-height:74px;font-size:10.5px;line-height:1.3}
.label b{display:block;font-family:var(--mono);font-size:17px;line-height:1}
.label .c{color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.07em}
.label ul{margin:4px 0 0;padding-left:13px}
.label li{margin:0;font-size:10px}
@media print{
  header.top,nav.tabs,.chips,.hint,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .labelsheet{grid-template-columns:repeat(4,1fr);gap:3px}
  .label{border:1px solid #999;break-inside:avoid;background:#fff}
}
@media (max-width:520px){
  .titlerow h1{font-size:15px}
  .qty{min-width:44px;font-size:15px}
  .boxno{min-width:42px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <h1>Box Inventory</h1>
      <span class="tag" id="stat-line"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="theme-btn" title="Light / dark">◐</button>
    </div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search parts, boxes, notes…  (press /)" autocomplete="off" spellcheck="false">
      <button class="clearq" id="clearq" title="Clear">✕</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

   The Google Sheet IS the database and a Google Form is the write API, so the
   PC server is no longer required for counts — only for photo identification.
   Reads: CSV export of the BOX tab + the form-responses tab (no auth; the
   sheet is link-view). Writes: a form POST (no auth; the form is link-respond).
   Appends resolve newest-wins, so a correction is just another row — which is
   also why single-user "collisions" are a non-issue: Google serializes form
   submits, and the later row simply wins. */

function categorize(name, note){
  const hay = (name + " " + (note || "")).toLowerCase();
  for(const [cat, re] of CATEGORY_RULES) if(re.test(hay)) return cat;
  return "misc";
}

const slugName = s => String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9]+/gi, " ").toLowerCase().trim();

/** dd/mm/yyyy [hh:mm:ss] -> sortable ISO-ish string, or null. */
function parseSheetDate(text){
  const m = String(text || "").trim()
    .match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}):(\d{2}))?$/);
  if(!m) return null;
  const p = n => String(n).padStart(2, "0");
  return `${m[3]}-${p(m[2])}-${p(m[1])}T${p(m[4]||0)}:${m[5]||"00"}:${m[6]||"00"}`;
}

/** The resolver, ported from build.py: newest row wins per (box, item).
    Form rows carry a real time of day, main-tab rows only a date — so a form
    write on the same day as a hand edit deliberately wins. Form rows are also
    deliberate recounts by definition, so they never raise the ambiguity flag. */
function resolveSheet(boxCsv, formCsv){
  const raw = [];
  const boxRows = parseCSV(boxCsv);
  for(let i = 1; i < boxRows.length; i++){
    const [box, name, qty, note, updated] = boxRows[i];
    if(!String(box || "").trim()) continue;
    raw.push({line: i, src: 0, box: parseInt(box, 10), name: (name||"").trim(),
              qtyTxt: (qty||"").trim(), note: (note||"").trim(),
              when: parseSheetDate(updated)});
  }
  const formRows = parseCSV(formCsv || "");
  for(let i = 1; i < formRows.length; i++){
    const [ts, box, name, qty, note] = formRows[i];
    if(!String(box || "").trim() || !String(name || "").trim()) continue;
    const b = parseInt(box, 10);
    if(!Number.isFinite(b)) continue;
    raw.push({line: i, src: 1, box: b, name: (name||"").trim(),
              qtyTxt: (qty||"").trim(), note: (note||"").trim(),
              when: parseSheetDate(ts)});
  }

  const groups = new Map();
  for(const r of raw){
    const k = r.box + "|" + slugName(r.name);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }

  const items = [];
  for(const [key, history] of groups){
    history.sort((a, b) => (a.when||"").localeCompare(b.when||"")
                        || a.src - b.src || a.line - b.line);
    const latest = history[history.length - 1];
    if(!latest.name) continue;

    let countType, qty;
    const qt = latest.qtyTxt.toLowerCase();
    if(qt === "") { countType = "unknown"; qty = null; }
    else if(qt === "many" || parseInt(qt, 10) === 99){ countType = "bulk"; qty = null; }
    else if(/^-?\d+$/.test(qt)){ countType = "exact"; qty = parseInt(qt, 10); }
    else { countType = "unknown"; qty = null; }

    let peak = countType === "exact" ? qty : null;
    for(const r of history){
      const n = parseInt(r.qtyTxt, 10);
      if(/^\d+$/.test(r.qtyTxt) && n !== 99) peak = Math.max(peak ?? 0, n);
    }

    const distinct = new Set(history.map(r => r.qtyTxt.toLowerCase()));
    const deliberate = latest.src === 1
        || (latest.note || "").toLowerCase().includes("photo-counted");
    const conflict = history.length > 1 && distinct.size > 1 && !deliberate;

    items.push({
      id: `${latest.box}-${slugName(latest.name)}`,
      box: latest.box, name: latest.name, qty, peak, countType,
      status: (countType === "exact" && qty === 0) ? "gone" : "active",
      note: latest.note || [...history].reverse().find(r => r.note)?.note || "",
      category: categorize(latest.name, latest.note),
      updated: latest.when ? latest.when.slice(0, 10) : null,
      conflict, restated: history.length > 1 && distinct.size === 1,
      history: history.length > 1
        ? history.map(r => ({qty: r.qtyTxt, date: r.when ? r.when.slice(0,10) : null,
                             note: r.note}))
        : [],
    });
  }
  items.sort((a, b) => a.box - b.box || a.name.localeCompare(b.name));

  const used = new Set(items.filter(i => i.status === "active").map(i => i.box));
  const known = new Set(items.map(i => i.box));
  const freeBoxes = [];
  const lows = [...known].filter(b => b < 400), highs = [...known].filter(b => b >= 400);
  for(const [lo, hi] of [[1, Math.max(0, ...lows)], [400, Math.max(0, ...highs)]])
    for(let b = lo; b <= hi; b++)
      if(!used.has(b)) freeBoxes.push({box: b, container: containerOf(b),
        reason: known.has(b) ? "emptied" : "never used"});

  return {meta: Object.assign({}, SEED?.meta, {
            source: "Google Sheet (live)", rawRows: raw.length,
            generated: new Date().toISOString().slice(0, 10)}),
          items, freeBoxes, splitItems: []};
}

/** Where the photo server lives when this page is NOT served by it.
    The APK injects window.BOXINV_SERVER; localStorage can override. */
function serverBase(){
  if(location.protocol === "http:" || location.protocol === "https:") return "";
  try{
    return window.BOXINV_SERVER || localStorage.getItem("boxinv.server")
        || "http://192.168.1.140:8781";
  }catch(e){ return "http://192.168.1.140:8781"; }
}

function sheetCsvUrl(gid){
  return `https://docs.google.com/spreadsheets/d/${SHEET.id}/export?format=csv&gid=${gid}&t=${Date.now()}`;
}

/** Fetch one tab as CSV text. Served pages go through the server's /proxy
    (docs.google.com sends no CORS headers, so a direct fetch from an http
    origin is blocked); the asset page in the APK fetches directly (the WebView
    grants file:// pages universal access). */
function fetchTab(gid){
  const direct = location.protocol === "file:";
  const url = direct ? sheetCsvUrl(gid) : `/proxy?gid=${gid}&t=${Date.now()}`;
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 20000;
    x.onload = () => (x.status >= 200 && x.status < 300)
        ? resolve(x.responseText) : reject(new Error("HTTP " + x.status));
    x.onerror = () => reject(new Error("network"));
    x.ontimeout = () => reject(new Error("timeout"));
    x.send();
  });
}

/** Append one row by submitting the hidden form. A form submission is a
    navigation, not an XHR, so CORS never applies — it works identically from
    the server page, the APK asset, and a desktop browser. The iframe's load
    event says "submitted"; the proof is the refetch afterwards. */
function sheetAppend({box, name, qty, note}){
  return new Promise(resolve => {
    let frame = document.getElementById("formsink");
    if(!frame){
      frame = document.createElement("iframe");
      frame.id = "formsink"; frame.name = "formsink"; frame.style.display = "none";
      document.body.appendChild(frame);
    }
    const f = document.createElement("form");
    f.action = SHEET.formAction; f.method = "POST"; f.target = "formsink";
    f.style.display = "none";
    const fields = {[SHEET.entries.box]: String(box),
                    [SHEET.entries.name]: name,
                    [SHEET.entries.qty]: String(qty),
                    [SHEET.entries.note]: note || ""};
    for(const [k, v] of Object.entries(fields)){
      const i = document.createElement("input");
      i.type = "hidden"; i.name = k; i.value = v;
      f.appendChild(i);
    }
    document.body.appendChild(f);
    let settled = false;
    const done = () => { if(!settled){ settled = true; f.remove(); resolve(); } };
    frame.addEventListener("load", done, {once: true});
    setTimeout(done, 5000);       // some browsers never fire load for iframes
    f.submit();
  });
}
const STORE_KEY = "boxinv.v1";
const CAT = SEED.meta.categoryLabels;
const CONTAINER_SIZE = SEED.meta.containerSize;
const STALE_DAYS = 150;
// At or below this, a part is worth reordering before a build stalls on it.
const LOW_STOCK = 2;

/** Low means "you had more and now you don't", not "you own one of these".
    Owning a single GPS module is not a shortage; going from five TMC2209s to
    one is. Without the peak this flagged 128 of 242 parts and meant nothing. */
function isRunningLow(i){
  if(i.countType !== "exact") return false;
  const now = Number(i.qty);
  if(!(now > 0 && now <= LOW_STOCK)) return false;
  return Number(i.peak || now) >= LOW_STOCK + 1;
}

/* ------------------------------------------------------------------ state */
let overlay = load();
let items = [];            // live merged list
let ui = { tab:"find", q:"", cats:new Set(), zone:"all", flag:null, open:null, box:null,
           bom:"", level:2, cap:6, openCard:null };

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return Object.assign({edits:{},added:[],journal:[]}, JSON.parse(raw));
  }catch(e){ console.warn("overlay unreadable, starting clean", e); }
  return {edits:{},added:[],journal:[]};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(overlay)); }
  catch(e){ toast("Could not save locally"); }
}
/* Boxes 1..399 and 400+ are two physically separate sets of containers,
   so each set is numbered from its own start. */
function containerOf(box){
  const base = box >= 400 ? 400 : 0;
  const n = Math.floor((box - base - 1) / CONTAINER_SIZE) + 1;
  return (base ? "H" : "") + n;
}
function containerRange(box){
  const base = box >= 400 ? 400 : 0;
  const c = Math.floor((box - base - 1) / CONTAINER_SIZE);
  return [base + c * CONTAINER_SIZE + 1, base + (c + 1) * CONTAINER_SIZE];
}
function rebuild(){
  const out = [];
  for(const it of SEED.items){
    const e = overlay.edits[it.id];
    if(e && e.deleted) continue;
    out.push(e ? Object.assign({}, it, e, {edited:true}) : it);
  }
  for(const it of overlay.added){
    if(!(overlay.edits[it.id] && overlay.edits[it.id].deleted))
      out.push(Object.assign({}, it, overlay.edits[it.id]||{}, {added:true}));
  }
  for(const it of out){
    it.container = containerOf(it.box);
    it.status = (it.countType === "exact" && Number(it.qty) === 0) ? "gone" : "active";
    it._hay = (it.name + " " + (it.note||"") + " " + (CAT[it.category]||it.category) + " box " + it.box).toLowerCase();
    it._tokName = tokens(it.name);
    it._tokAll  = tokens(it.name + " " + (it.note||"") + " " + (CAT[it.category]||it.category));
  }
  out.sort((a,b)=> a.box - b.box || a.name.localeCompare(b.name));
  items = out;
}
function journal(entry){
  overlay.journal.push(Object.assign({at:new Date().toISOString()}, entry));
  if(overlay.journal.length > 800) overlay.journal.splice(0, overlay.journal.length - 800);
}
function edit(id, patch, label){
  overlay.edits[id] = Object.assign({}, overlay.edits[id], patch);
  journal({id, patch, label});
  save(); rebuild(); render();
}

/* ------------------------------------------------------------------ utils */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const active = () => items.filter(i => i.status === "active");
function daysAgo(iso){
  if(!iso) return null;
  return Math.round((Date.now() - new Date(iso+"T12:00:00").getTime()) / 864e5);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1900);
}
function qtyHTML(it){
  if(it.countType === "bulk")    return `<div class="qty bulk">many<small>bulk</small></div>`;
  if(it.countType === "unknown") return `<div class="qty unknown">?<small>uncounted</small></div>`;
  const n = Number(it.qty)||0;
  return `<div class="qty${n===0?" zero":""}">${n}<small>${n===1?"pc":"pcs"}</small></div>`;
}
/* Split on everything except digits, letters, "." and "+" so that "m3.5" and
   "5v+" survive whole but "timing-belt" becomes two matchable words. */
function tokens(s){
  return String(s).toLowerCase().split(/[^a-z0-9.+]+/).filter(t => t.length > 1);
}
/* A needle word matches an item word only on a whole-word or prefix basis.
   Substring matching is wrong here: it made "TOF" match "cu-tof-fs". */
function wordHit(needle, list){
  for(const w of list){
    if(w === needle) return 1;
    if(needle.length >= 3 && w.startsWith(needle)) return 0.9;
    if(w.length >= 3 && needle.startsWith(w)) return 0.8;
  }
  return 0;
}
/* 0..1.25 — name matches outrank matches that only hit the note. */
function matchScore(needle, it){
  const words = tokens(needle);
  if(!words.length) return 0;
  let name = 0, all = 0;
  for(const w of words){ name += wordHit(w, it._tokName); all += wordHit(w, it._tokAll); }
  return (name / words.length) + 0.25 * (all / words.length);
}

/* The two box ranges actually in use, derived from the data (not hard-coded),
   so adding box 129 or 439 keeps the Boxes view and free-slot list correct. */
function boxRanges(){
  const elec = items.filter(i => i.box < 400).map(i => i.box);
  const house = items.filter(i => i.box >= 400).map(i => i.box);
  const out = [];
  if(elec.length)  out.push([1,   Math.max(...elec),  "Electronics"]);
  if(house.length) out.push([401, Math.max(...house), "Household"]);
  return out;
}

/* ------------------------------------------------------------------ issues */
function issues(){
  const list = active();
  const conflicts = items.filter(i => i.conflict && !i.edited);
  const bulk = list.filter(i => i.countType === "bulk" || i.countType === "unknown");
  const stale = list.filter(i => (daysAgo(i.updated)||0) > STALE_DAYS);
  const byName = new Map();
  for(const i of list){
    const k = i.name.toLowerCase().trim();
    if(!byName.has(k)) byName.set(k, []);
    byName.get(k).push(i.box);
  }
  const splits = [...byName.entries()]
    .filter(([,b]) => new Set(b).size > 1)
    .map(([n,b]) => ({name:n, boxes:[...new Set(b)].sort((x,y)=>x-y)}))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const used = new Set(list.map(i => i.box));
  const known = new Set(items.map(i => i.box));
  const free = [];
  for(const [lo,hi] of boxRanges())
    for(let b=lo; b<=hi; b++)
      if(!used.has(b)) free.push({box:b, reason: known.has(b) ? "emptied" : "never used"});
  return {conflicts, bulk, stale, splits, free,
          total: conflicts.length + splits.length + free.length};
}

/* --------------------------------------------------------------- Reorganize
   Three effort levels. Each returns concrete part-moves you can apply.
   Bulk piles are never merged into a shared box — a pile of 99 screws fills
   its own box physically, whatever the data says. */
function planMoves(level, cap){
  const list = active().map(i => ({it:i, box:i.box}));
  const moves = [];
  const mergeable = r => r.it.countType === "exact";
  const move = (r, to, why) => { if(r.box !== to){ moves.push({id:r.it.id, name:r.it.name,
      from:r.box, to, why}); r.box = to; } };
  const load = () => {                       // current box -> rows, using planned boxes
    const m = new Map();
    for(const r of list){ if(!m.has(r.box)) m.set(r.box, []); m.get(r.box).push(r); }
    return m;
  };

  // level 1 — the same part sitting in two boxes
  const byName = new Map();
  for(const r of list){
    const k = r.it.name.toLowerCase().trim();
    if(!byName.has(k)) byName.set(k, []);
    byName.get(k).push(r);
  }
  for(const [,rows] of byName){
    if(new Set(rows.map(r => r.box)).size < 2) continue;
    // keep it where the larger amount already is; ties go to the lower box number
    const home = rows.slice().sort((a,b) =>
      (Number(b.it.qty)||0) - (Number(a.it.qty)||0) || a.box - b.box)[0].box;
    for(const r of rows) move(r, home, "same part was in two boxes");
  }

  // level 2 — merge one-item boxes of the same category inside one container.
  // Repeat until stable: each pass empties boxes, which can leave new singles.
  const consolidate = () => {
    for(let pass = 0; pass < 8; pass++){
      const before = moves.length;
      const byCC = new Map();
      for(const r of list){
        const k = containerOf(r.box) + "|" + r.it.category;
        if(!byCC.has(k)) byCC.set(k, []);
        byCC.get(k).push(r);
      }
      for(const [,rows] of byCC){
        const l = load();                       // recomputed per group, per pass
        const singles = rows.filter(r => mergeable(r) && (l.get(r.box)||[]).length === 1);
        if(singles.length < 2) continue;
        const home = Math.min(...singles.map(r => r.box));
        let n = (l.get(home)||[]).length;
        for(const r of singles.sort((a,b)=>a.box-b.box)){
          if(r.box === home || n >= cap) continue;
          move(r, home, "one-item boxes of the same type, same container"); n++;
        }
      }
      if(moves.length === before) break;
    }
  };
  if(level >= 2) consolidate();

  // level 3 — give each category one home container and pack it there
  if(level >= 3){
    const cats = new Map();
    for(const r of list){
      if(!cats.has(r.it.category)) cats.set(r.it.category, []);
      cats.get(r.it.category).push(r);
    }
    for(const [cat, rows] of cats){
      const elec = rows.filter(r => r.box < 400);
      if(elec.length < 3) continue;                 // not worth moving crates for
      const tally = {};
      for(const r of elec) tally[containerOf(r.box)] = (tally[containerOf(r.box)]||0) + 1;
      const home = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
      const inHome = elec.filter(r => containerOf(r.box) === home).map(r => r.box);
      if(!inHome.length) continue;
      const targets = [...new Set(inHome)].sort((a,b)=>a-b);
      const l = load();
      let ti = 0;
      for(const r of elec.sort((a,b)=>a.box-b.box)){
        if(containerOf(r.box) === home) continue;
        if(!mergeable(r)) continue;                 // piles stay where they are
        while(ti < targets.length &&
              (l.get(targets[ti])||[]).length + moves.filter(m=>m.to===targets[ti]).length >= cap) ti++;
        if(ti >= targets.length) break;
        move(r, targets[ti], `${esc(CAT[cat]||cat)} belongs in container ${home}`);
      }
    }
    consolidate();   // regrouping leaves new one-item boxes behind; sweep them up
  }

  const boxesBefore = new Set(active().map(i => i.box));
  const boxesAfter  = new Set(list.map(r => r.box));
  const spread = rows => {
    const m = {};
    for(const r of rows){
      const c = r.it.category;
      (m[c] = m[c] || new Set()).add(containerOf(r.box));
    }
    return Object.values(m).reduce((a,s)=>a+s.size, 0) / Math.max(1, Object.keys(m).length);
  };
  return {
    moves,
    freed: [...boxesBefore].filter(b => !boxesAfter.has(b)).sort((a,b)=>a-b),
    spreadBefore: spread(active().map(i => ({it:i, box:i.box}))),
    spreadAfter: spread(list),
    pinned: list.filter(r => !mergeable(r)).length
  };
}

/* ------------------------------------------------------------------ views */
function render(){
  document.getElementById("stat-line").textContent =
    `${active().length} parts · ${new Set(active().map(i=>i.box)).size} boxes`;
  renderTabs();
  const v = document.getElementById("view");
  v.innerHTML = ({find:viewFind, boxes:viewBoxes, issues:viewIssues, build:viewBuild,
                  reorg:viewReorg, labels:viewLabels, data:viewData})[ui.tab]();
  wire();
}
function renderTabs(){
  // The badge counts jobs worth doing now, not every finding. It used to show
  // 22 — a number that only made the tab look like a chore.
  const n = todoCards().filter(c => c.tone === "now").length;
  const tabs = [["find","Find"],["boxes","Boxes"],["issues","To do"],["build","Build check"],
                ["reorg","Reorganize"],["labels","Labels"],["data","Data"]];
  document.getElementById("tabs").innerHTML = tabs.map(([k,label]) =>
    `<button data-tab="${k}" aria-selected="${ui.tab===k}">${label}${
      k==="issues" && n ? `<span class="badge">${n}</span>` : ""}</button>`).join("");
}

function filtered(){
  let list = items.filter(i => i.status === "active" || ui.flag === "gone");
  if(ui.zone === "elec")  list = list.filter(i => i.box < 400);
  if(ui.zone === "house") list = list.filter(i => i.box >= 400);
  if(ui.cats.size)        list = list.filter(i => ui.cats.has(i.category));
  if(ui.box != null)      list = list.filter(i => i.box === ui.box);
  if(ui.flag === "gone")  list = list.filter(i => i.status === "gone");
  if(ui.flag === "bulk")  list = list.filter(i => i.countType !== "exact");
  if(ui.flag === "conflict") list = list.filter(i => i.conflict);
  if(ui.flag === "stale") list = list.filter(i => (daysAgo(i.updated)||0) > STALE_DAYS);
  if(ui.flag === "low") list = list.filter(i =>
    isRunningLow(i));
  const q = ui.q.trim().toLowerCase();
  // Typing a bare box number jumps to that box instead of searching for the
  // digits — with 154 boxes that is what you nearly always mean.
  if(/^\d{1,3}$/.test(q) && items.some(i => i.box === Number(q))){
    return list.filter(i => i.box === Number(q));
  }
  if(q){
    const ts = tokens(q);
    list = list.filter(i => ts.every(t => i._hay.includes(t)))
               .map(i => [i, matchScore(q, i) + (i.name.toLowerCase().startsWith(q) ? .5 : 0)])
               .sort((a,b) => b[1]-a[1] || a[0].box-b[0].box)
               .map(p => p[0]);
  }
  return list;
}

function viewFind(){
  const counts = {};
  for(const i of active()) counts[i.category] = (counts[i.category]||0) + 1;
  const cats = Object.keys(CAT).filter(c => counts[c])
    .sort((a,b) => counts[b]-counts[a]);
  const rng = Object.fromEntries(boxRanges().map(([lo,hi,n]) => [n, `${lo}–${hi}`]));
  const zoneLabel = {all:"All", elec:`Electronics (${rng.Electronics||"—"})`,
                     house:`Household (${rng.Household||"—"})`};
  const chips =
    `<div class="chips">
      ${["all","elec","house"].map(z =>
        `<button class="chip" data-zone="${z}" aria-pressed="${ui.zone===z}">${zoneLabel[z]}</button>`).join("")}
      <span style="width:10px"></span>
      ${[["low","Running low"],["bulk","Uncounted"],["conflict","Ambiguous"],
         ["stale","Stale"],["gone","Removed"]].map(([k,l]) =>
        `<button class="chip" data-flag="${k}" aria-pressed="${ui.flag===k}">${l}</button>`).join("")}
    </div>
    <div class="chips">
      ${cats.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${ui.cats.has(c)}">${
        esc(CAT[c])}<span class="n">${counts[c]}</span></button>`).join("")}
    </div>`;
  const list = filtered();
  const boxNote = ui.box != null
    ? `<div class="hint">Showing box ${ui.box} only · <button class="iconbtn" data-clearbox="1">show all</button></div>` : "";
  if(!list.length)
    return chips + boxNote + `<div class="empty">Nothing matches.<br><br>
      <button class="btn" data-add="1">+ Add a part</button></div>`;
  return chips + boxNote +
    `<div class="hint">${list.length} result${list.length===1?"":"s"}
       · <button class="iconbtn" data-add="1">+ add part</button></div>
     <div class="list">${list.map(itemHTML).join("")}</div>`;
}

function itemHTML(it){
  const flags = [];
  if(it.conflict) flags.push(`<span class="tag err" title="The sheet recorded different quantities for this same box+item">ambiguous</span>`);
  if(it.status === "gone") flags.push(`<span class="tag err">removed</span>`);
  if(it.edited) flags.push(`<span class="tag flag">edited</span>`);
  if(it.added)  flags.push(`<span class="tag flag">new</span>`);
  const d = daysAgo(it.updated);
  const open = ui.open === it.id;
  const exact = it.countType === "exact";
  const low = isRunningLow(it);
  if(low) flags.push(`<span class="tag flag">was ${it.peak}, now ${it.qty}</span>`);
  return `<div class="item${low ? " low" : ""}" data-id="${esc(it.id)}">
    <button class="row" data-toggle="${esc(it.id)}">
      <span class="boxno"><b>${it.box}</b><span>box</span></span>
      <span class="itemmain">
        <span class="itemname">${esc(it.name)}</span>
        <span class="itemmeta">
          <span class="tag">${esc(CAT[it.category]||it.category)}</span>
          <span class="tag">cont. ${it.container}</span>
          ${d!=null?`<span class="tag"${d>STALE_DAYS?' style="opacity:.85"':''}>${d}d ago</span>`:""}
          ${flags.join("")}
        </span>
        ${it.note?`<span class="note">${esc(it.note)}</span>`:""}
      </span>
      ${qtyHTML(it)}
    </button>
    ${SERVED && exact ? `<span class="tally">
        <button data-tally="1" data-t-id="${esc(it.id)}" title="Put one back">+</button>
        <button data-tally="-1" data-t-id="${esc(it.id)}" title="Take one out"
          ${Number(it.qty) <= 0 ? "disabled" : ""}>−</button>
      </span>` : ""}
    ${open ? editorHTML(it) : ""}
  </div>`;
}

function editorHTML(it){
  const optCats = Object.keys(CAT).map(c =>
    `<option value="${c}"${c===it.category?" selected":""}>${esc(CAT[c])}</option>`).join("");
  const optCount = [["exact","exact count"],["bulk","bulk / many"],["unknown","uncounted"]]
    .map(([v,l]) => `<option value="${v}"${v===it.countType?" selected":""}>${l}</option>`).join("");
  const hist = (it.history&&it.history.length)
    ? `<div class="hist"><b>sheet history</b>${it.history.map(h =>
        `<div>${h.date||"?"} · qty ${h.qty===""?"—":h.qty}${h.note?" · "+esc(h.note):""}</div>`).join("")}</div>`
    : "";
  return `<div class="editor">
    <div class="eline">
      <label>Qty</label>
      <button class="step" data-step="-1">−</button>
      <input type="number" data-f="qty" value="${it.countType==="exact"?(Number(it.qty)||0):""}"
             ${it.countType!=="exact"?"disabled placeholder=\"—\"":""}>
      <button class="step" data-step="1">+</button>
      <select data-f="countType">${optCount}</select>
    </div>
    <div class="eline"><label>Box</label>
      <input type="number" data-f="box" value="${it.box}" min="1">
      <label>Type</label><select data-f="category" class="grow">${optCats}</select>
    </div>
    <div class="eline"><label>Name</label>
      <input type="text" data-f="name" class="grow" value="${esc(it.name)}"></div>
    <div class="eline"><label>Note</label>
      <input type="text" data-f="note" class="grow" value="${esc(it.note||"")}"
             placeholder="spec, where it came from, what it fits…"></div>
    <div class="ebtns">
      <button class="btn" data-savechanges="1">Save</button>
      <button class="btn ghost" data-onlybox="${it.box}">Show box ${it.box}</button>
      <button class="btn danger" data-del="1">Delete</button>
    </div>
    ${hist}
  </div>`;
}

function viewBoxes(){
  const byBox = new Map();
  for(const i of active()){
    if(!byBox.has(i.box)) byBox.set(i.box, []);
    byBox.get(i.box).push(i);
  }
  const q = ui.q.trim().toLowerCase();
  const hitBoxes = new Set(q ? filtered().map(i => i.box) : []);
  let html = `<div class="hint">Tap a box to list its contents. Dashed green = free slot you can reuse.</div>`;
  for(const [lo,hi,name] of boxRanges()){
    let last = null;
    for(let b=lo; b<=hi; b++){
      const c = containerOf(b);
      if(c !== last){
        if(last!==null) html += `</div>`;
        const [rlo,rhi] = containerRange(b);
        html += `<div class="container-h">${name} · container ${c} (boxes ${rlo}–${rhi})</div><div class="boxgrid">`;
        last = c;
      }
      const contents = byBox.get(b);
      const free = !contents;
      html += `<button class="boxcell${free?" free":""}${hitBoxes.has(b)?" hit":""}" data-box="${b}">
        <b>${b}</b><span>${free?"free":contents.length+(contents.length===1?" item":" items")}</span></button>`;
    }
    html += `</div>`;
  }
  return html;
}

/* Ranked jobs rather than a flat dump of every finding. Order is impact first:
   data that is wrong, then time wasted at the bench, then opportunities, then
   hygiene. Each card names one action and shows only a handful of targets. */
function todoCards(){
  const s = issues();
  const cards = [];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  if(s.conflicts.length) cards.push({
    tone:"now", when:"Do first",
    title:`Count ${plural(s.conflicts.length, "part", "parts")} the sheet contradicts itself on`,
    why:"These were written down twice with different numbers, so the count you see is the newest guess, not a fact. One count each settles it permanently.",
    effort:`~${s.conflicts.length} min`,
    targets: s.conflicts.map(i => ({box:i.box, label:`${esc(i.name)} — showing ${
      i.countType === "exact" ? i.qty : "many"}`})),
  });

  if(s.splits.length) cards.push({
    tone:"now", when:"Do first",
    title:`Merge ${plural(s.splits.length, "part", "parts")} living in two boxes`,
    why:"Every time you look one of these up you can open the wrong box. The Reorganize tab does all of them in one pass.",
    effort:`${s.splits.length} moves`,
    targets: s.splits.map(x => ({box:x.boxes[0],
      label:`${esc(x.name)} — boxes ${x.boxes.join(" and ")}`})),
    go:{tab:"reorg", level:1, label:"Plan the merge"},
  });

  // Down to the last one or two — the thing you find out at the worst moment.
  const low = active()
    .filter(i => i.countType === "exact" && Number(i.qty) > 0 && Number(i.qty) <= LOW_STOCK)
    .sort((a,b) => a.qty - b.qty || a.box - b.box);
  if(low.length) cards.push({
    tone:"soon", when:"Before your next order",
    title:`${plural(low.length, "part is", "parts are")} nearly used up`,
    why:"You had more of these and now you do not — the count has actually come down. Parts you simply own one of are not listed here. Worth a glance before you next order anything.",
    effort:"reading, not work",
    targets: low.map(i => ({box:i.box, label:`${esc(i.name)} — was ${i.peak}, ${i.qty} left`})),
  });

  const gone = active().filter(i => i.countType === "exact" && Number(i.qty) === 0);
  if(gone.length) cards.push({
    tone:"soon", when:"Worth knowing",
    title:`${plural(gone.length, "part is", "parts are")} at zero but still listed`,
    why:"The box is empty. Either the part is genuinely used up — in which case the box number is free — or the count is wrong.",
    effort:"a look each",
    targets: gone.map(i => ({box:i.box, label:`${esc(i.name)} — box ${i.box} is empty`})),
  });

  const risky = s.bulk.filter(i => ["mcu","sensor","driver","power","motor","interface","comms"]
    .includes(i.category));
  if(risky.length) cards.push({
    tone:"soon", when:"Worth doing",
    title:`Put a real number on ${plural(risky.length, "pile", "piles")} you could run out of`,
    why:"“Many” is fine for screws — it is not fine for parts a build depends on, because Build check cannot warn you that four are left. These are the electronics ones.",
    effort:"a few minutes each",
    targets: risky.map(i => ({box:i.box, label:esc(i.name)})),
  });

  if(s.free.length) cards.push({
    tone:"later", when:"When you feel like it",
    title:`Reuse ${plural(s.free.length, "free box number", "free box numbers")}`,
    why:"Empty or never used. Fill these before buying more boxes — and the Reorganize tab can free a lot more.",
    effort:"no work, just useful",
    targets: s.free.slice(0, 6).map(f => ({box:f.box, label:`box ${f.box} — ${f.reason}`})),
    extra: s.free.length - 6,
    go:{tab:"reorg", level:2, label:"See what else frees up"},
  });

  const bulkRest = s.bulk.length - risky.length;
  if(bulkRest > 0 || s.stale.length) cards.push({
    tone:"later", when:"No hurry",
    title:"Spot-check the rest when a container is open anyway",
    why:`${bulkRest} more uncounted piles (screws, scrap, consumables) and ${s.stale.length} parts not touched in over ${STALE_DAYS} days. Nothing here is wrong — it is just old. Do not make a job of it.`,
    effort:"opportunistic",
    targets: s.stale.slice(0, 4).map(i => ({box:i.box, label:`box ${i.box} · ${esc(i.name)}`})),
    extra: Math.max(0, s.stale.length - 4),
  });

  return cards;
}

function viewIssues(){
  const cards = todoCards();
  if(!cards.length)
    return `<div class="empty">Nothing needs attention.<br>Every count is unambiguous and no part is in two places.</div>`;

  const urgent = cards.filter(c => c.tone === "now").length;
  const html = cards.map((c, idx) => `
    <div class="card ${c.tone}">
      <div class="cardtop">
        <span class="when">${c.when}</span>
        <span class="effort">${esc(c.effort)}</span>
      </div>
      <h3>${c.title}</h3>
      <p class="why">${c.why}</p>
      ${c.targets.length ? `<ul class="targets">${c.targets.slice(0, ui.openCard === idx ? 99 : 3)
        .map(t => `<li><a href="#" data-box="${t.box}">${t.label}</a></li>`).join("")}</ul>` : ""}
      ${(c.targets.length > 3 || c.extra)
        ? `<button class="more" data-card="${idx}">${
            ui.openCard === idx
              ? "show less"
              : `show all ${c.targets.length + (c.extra || 0)}`}</button>`
        : ""}
      ${c.go ? `<div class="ebtns"><button class="btn" data-go='${
        JSON.stringify(c.go)}'>${esc(c.go.label)}</button></div>` : ""}
    </div>`).join("");

  return `<div class="hint">${urgent
      ? `${urgent} thing${urgent===1?"":"s"} worth doing now, ${cards.length-urgent} that can wait.`
      : `Nothing urgent — ${cards.length} thing${cards.length===1?"":"s"} for when you have time.`}
    </div>${html}
    <div class="donebar">That is the whole list — the rest of the inventory is fine.</div>`;
}

function viewBuild(){
  const lines = ui.bom.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const list = active();
  const MIN = 0.55;
  let results = "";
  if(lines.length){
    let have = 0, missing = 0;
    const boxes = new Set();
    const rows = lines.map(line => {
      const m = line.match(/^(\d+)\s*[x×*]?\s+(.*)$/i);
      const need = m ? parseInt(m[1],10) : 1;
      const term = m ? m[2] : line;
      let ranked = list.map(i => [i, matchScore(term, i)])
                         .filter(p => p[1] >= MIN)
                         // equal score: the shorter name is the more specific part
                         .sort((a,b) => b[1]-a[1] || a[0].name.length-b[0].name.length || a[0].box-b[0].box)
                         .slice(0,4);
      // Among near-equally good name matches, prefer one that actually covers
      // the quantity: a bulk pile of limit switches beats the single odd one.
      let best = ranked[0];
      if(best){
        const covers = p => p[0].countType !== "exact" || Number(p[0].qty) >= need;
        best = ranked.filter(p => p[1] >= best[1] * 0.9).find(covers) || ranked[0];
        ranked = [best, ...ranked.filter(p => p !== best)];
      }
      let pill, detail;
      if(!best){ pill = `<span class="pill no">not in any box</span>`; detail = ""; missing++; }
      else{
        const it = best[0];
        boxes.add(it.box);
        const enough = it.countType !== "exact" || Number(it.qty) >= need;
        pill = enough ? `<span class="pill ok">box ${it.box}</span>`
                      : `<span class="pill maybe">box ${it.box} · only ${it.qty}</span>`;
        if(enough) have++; else missing++;
        detail = `<div>${esc(it.name)} — ${it.countType==="exact"?it.qty+" pcs":"bulk"}
          · container ${it.container}</div>` +
          (ranked.length>1 ? `<div class="alt">also: ${ranked.slice(1).map(p =>
            `box ${p[0].box} ${esc(p[0].name)}`).join(" · ")}</div>` : "");
      }
      return `<div class="bomrow"><div class="bomq">${need}×</div>
        <div class="bomhit"><div><b>${esc(term)}</b> ${pill}</div>${detail}</div></div>`;
    }).join("");
    const boxList = [...boxes].sort((a,b)=>a-b);
    results = `<div class="panel">
      <h2>Result <span class="count">${have} found · ${missing} to sort out</span></h2>
      ${boxList.length?`<p class="sub"><b>Open these boxes:</b> ${boxList.map(b=>
        `<a href="#" data-box="${b}">${b}</a>`).join(" · ")}
        &nbsp;(container${boxList.length>1?"s":""} ${[...new Set(boxList.map(containerOf))].join(", ")})</p>`:""}
      ${rows}</div>`;
  }
  return `<div class="panel">
    <h2>Build check</h2>
    <p class="sub">Paste a parts list — one per line, optionally “2x ” in front.
      It tells you which boxes to open and what you are missing.</p>
    <textarea class="bom" id="bomtext" placeholder="1x ESP32-C3&#10;1x TMC2209&#10;2x limit switch&#10;1x TOF sensor&#10;4x M3 bolt&#10;1x GT2 belt">${esc(ui.bom)}</textarea>
    <div class="ebtns" style="margin-top:9px">
      <button class="btn" id="runbom">Check</button>
      <button class="btn ghost" id="clearbom">Clear</button>
    </div>
  </div>${results}`;
}

function viewReorg(){
  const cap = ui.cap, lvl = ui.level;
  const p = planMoves(lvl, cap);
  const levels = [
    [1, "Merge duplicates", "Only pull the same part out of two boxes into one."],
    [2, "Consolidate singles", "Also merge one-item boxes of the same type inside the same container."],

/* ------------------------------------------------------------------ export */
function toCSV(){
  const head = ["Box","Item","Qty","Note","UpdatedAt"];
  const q = v => /[",\n]/.test(v) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
  const d = new Date(), pad = n => String(n).padStart(2,"0");
  const today = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  const rows = items.filter(i => i.status === "active").map(i => [
    i.box, i.name,
    i.countType === "exact" ? i.qty : (i.countType === "bulk" ? "many" : ""),
    i.note || "", i.edited || i.added ? today : (i.updated ? i.updated.split("-").reverse().join("/") : "")
  ].map(q).join(","));
  return [head.join(","), ...rows].join("\r\n");
}
function download(name, text, mime){
  const b = new Blob([text], {type: mime||"text/plain;charset=utf-8"});
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
  toast("Saved " + name);
}
function parseCSV(text){
  const rows = []; let row = [], cell = "", inQ = false;
  text = text.replace(/^﻿/, "");
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if(c === '"') inQ = true;
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r") cell += c;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
