<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box Inventory</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#eef1f5; --line:#d8dee7;
  --ink:#141821; --ink-2:#5b6675; --ink-3:#8a93a2;
  --accent:#1d5cff; --accent-ink:#ffffff;
  --ok:#0f8a4d; --warn:#b06f00; --bad:#c0392b; --bulk:#6b4fc9;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --panel:#161b24; --panel-2:#1e2530; --line:#2b3442;
    --ink:#e8ecf3; --ink-2:#a4b0c0; --ink-3:#71809a;
    --accent:#5b8cff; --accent-ink:#0b0f16;
    --ok:#3fbf7f; --warn:#e0a33a; --bad:#ff6b5e; --bulk:#a48bff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b24; --panel-2:#1e2530; --line:#2b3442;
  --ink:#e8ecf3; --ink-2:#a4b0c0; --ink-3:#71809a;
  --accent:#5b8cff; --accent-ink:#0b0f16;
  --ok:#3fbf7f; --warn:#e0a33a; --bad:#ff6b5e; --bulk:#a48bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------------------------------------------------------------- layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 12px 72px}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:10px 0 8px; border-bottom:1px solid var(--line);
}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.titlerow h1{font-size:17px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.titlerow .spacer{flex:1}
.iconbtn{
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
  padding:6px 10px; font-size:13px; color:var(--ink-2);
}
.iconbtn:hover{border-color:var(--accent);color:var(--ink)}

.searchrow{display:flex;gap:8px}
#q{
  flex:1; padding:11px 13px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); font-size:16px; box-shadow:var(--shadow);
}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.clearq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px}

nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:6px 11px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
nav.tabs .badge{
  display:inline-block;min-width:17px;margin-left:5px;padding:0 5px;
  background:var(--bad);color:#fff;border-radius:9px;font-size:11px;font-weight:700;text-align:center
}

/* ---------------------------------------------------------------- chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.chip{
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:12.5px;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}

.hint{color:var(--ink-3);font-size:12.5px;margin:8px 2px}

/* ---------------------------------------------------------------- items */
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.item>.row{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;width:100%;
  background:none;border:0;text-align:left}
.boxno{
  flex:none;min-width:46px;height:40px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line); display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono); line-height:1;
}
.boxno b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.boxno span{font-size:8.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.itemmain{flex:1;min-width:0}
.itemname{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.itemmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--ink-2)}
.tag{background:var(--panel-2);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.tag.flag{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:600}
.tag.err{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);font-weight:600}
.note{color:var(--ink-3);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.qty{
  flex:none;min-width:52px;text-align:right;font-family:var(--mono);
  font-size:17px;font-weight:700;letter-spacing:-.02em;
}
.qty small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-family:var(--sans)}
.qty.bulk{color:var(--bulk)} .qty.unknown{color:var(--ink-3)} .qty.zero{color:var(--bad)}

/* editor */
.editor{border-top:1px dashed var(--line);padding:11px 12px;background:var(--panel-2)}
.eline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.eline label{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;min-width:62px}
.editor input,.editor select,.editor textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px
}
.editor input[type=number]{width:78px;font-family:var(--mono)}
.editor .grow{flex:1;min-width:150px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:17px;font-weight:700;line-height:1}
.ebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:var(--panel);color:var(--bad);border:1px solid var(--bad)}
.hist{margin-top:9px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.hist div{padding:1px 0}

/* ---------------------------------------------------------------- boxes */
.container-h{margin:18px 0 7px;font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.boxcell{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 4px;
  text-align:center;font-family:var(--mono);position:relative
}
.boxcell b{display:block;font-size:15px;font-weight:700}
.boxcell span{display:block;font-size:10px;color:var(--ink-3);font-family:var(--sans);margin-top:2px}
.boxcell.free{border-style:dashed;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.boxcell.free span{color:var(--ok);font-weight:700}
.boxcell.hit{outline:2px solid var(--accent)}
.boxcell:hover{border-color:var(--accent)}

/* ---------------------------------------------------------------- panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-top:10px}
.panel h2{margin:0 0 4px;font-size:14.5px}
.panel h2 .count{color:var(--ink-3);font-weight:500;font-size:13px}
.panel p.sub{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:3px 0;font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px}
.kv b{font-family:var(--mono);font-weight:700;text-align:right}
textarea.bom{width:100%;min-height:130px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:10px;font-family:var(--mono);font-size:13px;resize:vertical}
.bomrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.bomrow:first-child{border-top:0}
.bomq{flex:none;font-family:var(--mono);font-weight:700;min-width:34px}
.bomhit{flex:1;min-width:0;font-size:13.5px}
.bomhit .alt{color:var(--ink-3);font-size:12px}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;font-family:var(--sans)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.maybe{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* camera — only rendered when served over http (i.e. from the phone) */
#cam{
  position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:40; width:60px; height:60px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); border:0; font-size:25px;
  box-shadow:0 4px 16px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
}
#cam:active{transform:scale(.94)}
#cam[data-busy="1"]{opacity:.6}
#cam .n{
  position:absolute; top:-3px; right:-3px; min-width:21px; height:21px; padding:0 5px;
  background:var(--warn); color:#fff; border-radius:11px; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center; font-family:var(--sans);
}
.empty{text-align:center;color:var(--ink-3);padding:38px 12px;font-size:14px}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .18s
}
.toast.show{opacity:1}

/* ---------------------------------------------------------------- labels */
.labelsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.label{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:var(--panel);
  min-height:74px;font-size:10.5px;line-height:1.3}
.label b{display:block;font-family:var(--mono);font-size:17px;line-height:1}
.label .c{color:var(--ink-3);font-size:9px;text-transform:uppercase;letter-spacing:.07em}
.label ul{margin:4px 0 0;padding-left:13px}
.label li{margin:0;font-size:10px}
@media print{
  header.top,nav.tabs,.chips,.hint,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .labelsheet{grid-template-columns:repeat(4,1fr);gap:3px}
  .label{border:1px solid #999;break-inside:avoid;background:#fff}
}
@media (max-width:520px){
  .titlerow h1{font-size:15px}
  .qty{min-width:44px;font-size:15px}
  .boxno{min-width:42px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <h1>Box Inventory</h1>
      <span class="tag" id="stat-line"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="theme-btn" title="Light / dark">◐</button>
    </div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search parts, boxes, notes…  (press /)" autocomplete="off" spellcheck="false">
      <button class="clearq" id="clearq" title="Clear">✕</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const SEED = /*__INVENTORY_DATA__*/null;
const STORE_KEY = "boxinv.v1";
const CAT = SEED.meta.categoryLabels;
const CONTAINER_SIZE = SEED.meta.containerSize;
const STALE_DAYS = 150;

/* ------------------------------------------------------------------ state */
let overlay = load();
let items = [];            // live merged list
let ui = { tab:"find", q:"", cats:new Set(), zone:"all", flag:null, open:null, box:null,
           bom:"", level:2, cap:6 };

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return Object.assign({edits:{},added:[],journal:[]}, JSON.parse(raw));
  }catch(e){ console.warn("overlay unreadable, starting clean", e); }
  return {edits:{},added:[],journal:[]};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(overlay)); }
  catch(e){ toast("Could not save locally"); }
}
/* Boxes 1..399 and 400+ are two physically separate sets of containers,
   so each set is numbered from its own start. */
function containerOf(box){
  const base = box >= 400 ? 400 : 0;
  const n = Math.floor((box - base - 1) / CONTAINER_SIZE) + 1;
  return (base ? "H" : "") + n;
}
function containerRange(box){
  const base = box >= 400 ? 400 : 0;
  const c = Math.floor((box - base - 1) / CONTAINER_SIZE);
  return [base + c * CONTAINER_SIZE + 1, base + (c + 1) * CONTAINER_SIZE];
}
function rebuild(){
  const out = [];
  for(const it of SEED.items){
    const e = overlay.edits[it.id];
    if(e && e.deleted) continue;
    out.push(e ? Object.assign({}, it, e, {edited:true}) : it);
  }
  for(const it of overlay.added){
    if(!(overlay.edits[it.id] && overlay.edits[it.id].deleted))
      out.push(Object.assign({}, it, overlay.edits[it.id]||{}, {added:true}));
  }
  for(const it of out){
    it.container = containerOf(it.box);
    it.status = (it.countType === "exact" && Number(it.qty) === 0) ? "gone" : "active";
    it._hay = (it.name + " " + (it.note||"") + " " + (CAT[it.category]||it.category) + " box " + it.box).toLowerCase();
    it._tokName = tokens(it.name);
    it._tokAll  = tokens(it.name + " " + (it.note||"") + " " + (CAT[it.category]||it.category));
  }
  out.sort((a,b)=> a.box - b.box || a.name.localeCompare(b.name));
  items = out;
}
function journal(entry){
  overlay.journal.push(Object.assign({at:new Date().toISOString()}, entry));
  if(overlay.journal.length > 800) overlay.journal.splice(0, overlay.journal.length - 800);
}
function edit(id, patch, label){
  overlay.edits[id] = Object.assign({}, overlay.edits[id], patch);
  journal({id, patch, label});
  save(); rebuild(); render();
}

/* ------------------------------------------------------------------ utils */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const active = () => items.filter(i => i.status === "active");
function daysAgo(iso){
  if(!iso) return null;
  return Math.round((Date.now() - new Date(iso+"T12:00:00").getTime()) / 864e5);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1900);
}
function qtyHTML(it){
  if(it.countType === "bulk")    return `<div class="qty bulk">many<small>bulk</small></div>`;
  if(it.countType === "unknown") return `<div class="qty unknown">?<small>uncounted</small></div>`;
  const n = Number(it.qty)||0;
  return `<div class="qty${n===0?" zero":""}">${n}<small>${n===1?"pc":"pcs"}</small></div>`;
}
/* Split on everything except digits, letters, "." and "+" so that "m3.5" and
   "5v+" survive whole but "timing-belt" becomes two matchable words. */
function tokens(s){
  return String(s).toLowerCase().split(/[^a-z0-9.+]+/).filter(t => t.length > 1);
}
/* A needle word matches an item word only on a whole-word or prefix basis.
   Substring matching is wrong here: it made "TOF" match "cu-tof-fs". */
function wordHit(needle, list){
  for(const w of list){
    if(w === needle) return 1;
    if(needle.length >= 3 && w.startsWith(needle)) return 0.9;
    if(w.length >= 3 && needle.startsWith(w)) return 0.8;
  }
  return 0;
}
/* 0..1.25 — name matches outrank matches that only hit the note. */
function matchScore(needle, it){
  const words = tokens(needle);
  if(!words.length) return 0;
  let name = 0, all = 0;
  for(const w of words){ name += wordHit(w, it._tokName); all += wordHit(w, it._tokAll); }
  return (name / words.length) + 0.25 * (all / words.length);
}

/* The two box ranges actually in use, derived from the data (not hard-coded),
   so adding box 129 or 439 keeps the Boxes view and free-slot list correct. */
function boxRanges(){
  const elec = items.filter(i => i.box < 400).map(i => i.box);
  const house = items.filter(i => i.box >= 400).map(i => i.box);
  const out = [];
  if(elec.length)  out.push([1,   Math.max(...elec),  "Electronics"]);
  if(house.length) out.push([401, Math.max(...house), "Household"]);
  return out;
}

/* ------------------------------------------------------------------ issues */
function issues(){
  const list = active();
  const conflicts = items.filter(i => i.conflict && !i.edited);
  const bulk = list.filter(i => i.countType === "bulk" || i.countType === "unknown");
  const stale = list.filter(i => (daysAgo(i.updated)||0) > STALE_DAYS);
  const byName = new Map();
  for(const i of list){
    const k = i.name.toLowerCase().trim();
    if(!byName.has(k)) byName.set(k, []);
    byName.get(k).push(i.box);
  }
  const splits = [...byName.entries()]
    .filter(([,b]) => new Set(b).size > 1)
    .map(([n,b]) => ({name:n, boxes:[...new Set(b)].sort((x,y)=>x-y)}))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const used = new Set(list.map(i => i.box));
  const known = new Set(items.map(i => i.box));
  const free = [];
  for(const [lo,hi] of boxRanges())
    for(let b=lo; b<=hi; b++)
      if(!used.has(b)) free.push({box:b, reason: known.has(b) ? "emptied" : "never used"});
  return {conflicts, bulk, stale, splits, free,
          total: conflicts.length + splits.length + free.length};
}

/* --------------------------------------------------------------- reorganise
   Three effort levels. Each returns concrete part-moves you can apply.
   Bulk piles are never merged into a shared box — a pile of 99 screws fills
   its own box physically, whatever the data says. */
function planMoves(level, cap){
  const list = active().map(i => ({it:i, box:i.box}));
  const moves = [];
  const mergeable = r => r.it.countType === "exact";
  const move = (r, to, why) => { if(r.box !== to){ moves.push({id:r.it.id, name:r.it.name,
      from:r.box, to, why}); r.box = to; } };
  const load = () => {                       // current box -> rows, using planned boxes
    const m = new Map();
    for(const r of list){ if(!m.has(r.box)) m.set(r.box, []); m.get(r.box).push(r); }
    return m;
  };

  // level 1 — the same part sitting in two boxes
  const byName = new Map();
  for(const r of list){
    const k = r.it.name.toLowerCase().trim();
    if(!byName.has(k)) byName.set(k, []);
    byName.get(k).push(r);
  }
  for(const [,rows] of byName){
    if(new Set(rows.map(r => r.box)).size < 2) continue;
    // keep it where the larger amount already is; ties go to the lower box number
    const home = rows.slice().sort((a,b) =>
      (Number(b.it.qty)||0) - (Number(a.it.qty)||0) || a.box - b.box)[0].box;
    for(const r of rows) move(r, home, "same part was in two boxes");
  }

  // level 2 — merge one-item boxes of the same category inside one container.
  // Repeat until stable: each pass empties boxes, which can leave new singles.
  const consolidate = () => {
    for(let pass = 0; pass < 8; pass++){
      const before = moves.length;
      const byCC = new Map();
      for(const r of list){
        const k = containerOf(r.box) + "|" + r.it.category;
        if(!byCC.has(k)) byCC.set(k, []);
        byCC.get(k).push(r);
      }
      for(const [,rows] of byCC){
        const l = load();                       // recomputed per group, per pass
        const singles = rows.filter(r => mergeable(r) && (l.get(r.box)||[]).length === 1);
        if(singles.length < 2) continue;
        const home = Math.min(...singles.map(r => r.box));
        let n = (l.get(home)||[]).length;
        for(const r of singles.sort((a,b)=>a.box-b.box)){
          if(r.box === home || n >= cap) continue;
          move(r, home, "one-item boxes of the same type, same container"); n++;
        }
      }
      if(moves.length === before) break;
    }
  };
  if(level >= 2) consolidate();

  // level 3 — give each category one home container and pack it there
  if(level >= 3){
    const cats = new Map();
    for(const r of list){
      if(!cats.has(r.it.category)) cats.set(r.it.category, []);
      cats.get(r.it.category).push(r);
    }
    for(const [cat, rows] of cats){
      const elec = rows.filter(r => r.box < 400);
      if(elec.length < 3) continue;                 // not worth moving crates for
      const tally = {};
      for(const r of elec) tally[containerOf(r.box)] = (tally[containerOf(r.box)]||0) + 1;
      const home = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0][0];
      const inHome = elec.filter(r => containerOf(r.box) === home).map(r => r.box);
      if(!inHome.length) continue;
      const targets = [...new Set(inHome)].sort((a,b)=>a-b);
      const l = load();
      let ti = 0;
      for(const r of elec.sort((a,b)=>a.box-b.box)){
        if(containerOf(r.box) === home) continue;
        if(!mergeable(r)) continue;                 // piles stay where they are
        while(ti < targets.length &&
              (l.get(targets[ti])||[]).length + moves.filter(m=>m.to===targets[ti]).length >= cap) ti++;
        if(ti >= targets.length) break;
        move(r, targets[ti], `${esc(CAT[cat]||cat)} belongs in container ${home}`);
      }
    }
    consolidate();   // regrouping leaves new one-item boxes behind; sweep them up
  }

  const boxesBefore = new Set(active().map(i => i.box));
  const boxesAfter  = new Set(list.map(r => r.box));
  const spread = rows => {
    const m = {};
    for(const r of rows){
      const c = r.it.category;
      (m[c] = m[c] || new Set()).add(containerOf(r.box));
    }
    return Object.values(m).reduce((a,s)=>a+s.size, 0) / Math.max(1, Object.keys(m).length);
  };
  return {
    moves,
    freed: [...boxesBefore].filter(b => !boxesAfter.has(b)).sort((a,b)=>a-b),
    spreadBefore: spread(active().map(i => ({it:i, box:i.box}))),
    spreadAfter: spread(list),
    pinned: list.filter(r => !mergeable(r)).length
  };
}

function renderTabs(){

function filtered(){
  let list = items.filter(i => i.status === "active" || ui.flag === "gone");
  if(ui.zone === "elec")  list = list.filter(i => i.box < 400);
  if(ui.zone === "house") list = list.filter(i => i.box >= 400);
  if(ui.cats.size)        list = list.filter(i => ui.cats.has(i.category));
  if(ui.box != null)      list = list.filter(i => i.box === ui.box);
  if(ui.flag === "gone")  list = list.filter(i => i.status === "gone");
  if(ui.flag === "bulk")  list = list.filter(i => i.countType !== "exact");
  if(ui.flag === "conflict") list = list.filter(i => i.conflict);
  if(ui.flag === "stale") list = list.filter(i => (daysAgo(i.updated)||0) > STALE_DAYS);
  const q = ui.q.trim().toLowerCase();
  if(q){
    const ts = tokens(q);
    list = list.filter(i => ts.every(t => i._hay.includes(t)))
               .map(i => [i, matchScore(q, i) + (i.name.toLowerCase().startsWith(q) ? .5 : 0)])
               .sort((a,b) => b[1]-a[1] || a[0].box-b[0].box)
               .map(p => p[0]);
  }
  return list;
}

function viewBoxes(){
  const byBox = new Map();
  for(const i of active()){
    if(!byBox.has(i.box)) byBox.set(i.box, []);
    byBox.get(i.box).push(i);
  }
  const q = ui.q.trim().toLowerCase();
  const hitBoxes = new Set(q ? filtered().map(i => i.box) : []);
  let html = `<div class="hint">Tap a box to list its contents. Dashed green = free slot you can reuse.</div>`;
  for(const [lo,hi,name] of boxRanges()){
    let last = null;
    for(let b=lo; b<=hi; b++){
      const c = containerOf(b);
      if(c !== last){
        if(last!==null) html += `</div>`;
        const [rlo,rhi] = containerRange(b);
        html += `<div class="container-h">${name} · container ${c} (boxes ${rlo}–${rhi})</div><div class="boxgrid">`;
        last = c;
      }
      const contents = byBox.get(b);
      const free = !contents;
      html += `<button class="boxcell${free?" free":""}${hitBoxes.has(b)?" hit":""}" data-box="${b}">
        <b>${b}</b><span>${free?"free":contents.length+(contents.length===1?" item":" items")}</span></button>`;
    }
    html += `</div>`;
  }
  return html;
}

function viewBuild(){
  const lines = ui.bom.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const list = active();
  const MIN = 0.55;
  let results = "";
  if(lines.length){
    let have = 0, missing = 0;
    const boxes = new Set();
    const rows = lines.map(line => {
      const m = line.match(/^(\d+)\s*[x×*]?\s+(.*)$/i);
      const need = m ? parseInt(m[1],10) : 1;
      const term = m ? m[2] : line;
      let ranked = list.map(i => [i, matchScore(term, i)])
                         .filter(p => p[1] >= MIN)
                         // equal score: the shorter name is the more specific part
                         .sort((a,b) => b[1]-a[1] || a[0].name.length-b[0].name.length || a[0].box-b[0].box)
                         .slice(0,4);
      // Among near-equally good name matches, prefer one that actually covers
      // the quantity: a bulk pile of limit switches beats the single odd one.
      let best = ranked[0];
      if(best){
        const covers = p => p[0].countType !== "exact" || Number(p[0].qty) >= need;
        best = ranked.filter(p => p[1] >= best[1] * 0.9).find(covers) || ranked[0];
        ranked = [best, ...ranked.filter(p => p !== best)];
      }
      let pill, detail;
      if(!best){ pill = `<span class="pill no">not in any box</span>`; detail = ""; missing++; }
      else{
        const it = best[0];
        boxes.add(it.box);
        const enough = it.countType !== "exact" || Number(it.qty) >= need;
        pill = enough ? `<span class="pill ok">box ${it.box}</span>`
                      : `<span class="pill maybe">box ${it.box} · only ${it.qty}</span>`;
        if(enough) have++; else missing++;
        detail = `<div>${esc(it.name)} — ${it.countType==="exact"?it.qty+" pcs":"bulk"}
          · container ${it.container}</div>` +
          (ranked.length>1 ? `<div class="alt">also: ${ranked.slice(1).map(p =>
            `box ${p[0].box} ${esc(p[0].name)}`).join(" · ")}</div>` : "");
      }
      return `<div class="bomrow"><div class="bomq">${need}×</div>
        <div class="bomhit"><div><b>${esc(term)}</b> ${pill}</div>${detail}</div></div>`;
    }).join("");
    const boxList = [...boxes].sort((a,b)=>a-b);
    results = `<div class="panel">
      <h2>Result <span class="count">${have} found · ${missing} to sort out</span></h2>
      ${boxList.length?`<p class="sub"><b>Open these boxes:</b> ${boxList.map(b=>
        `<a href="#" data-box="${b}">${b}</a>`).join(" · ")}
        &nbsp;(container${boxList.length>1?"s":""} ${[...new Set(boxList.map(containerOf))].join(", ")})</p>`:""}
      ${rows}</div>`;
  }
  return `<div class="panel">
    <h2>Build check</h2>
    <p class="sub">Paste a parts list — one per line, optionally “2x ” in front.
      It tells you which boxes to open and what you are missing.</p>
    <textarea class="bom" id="bomtext" placeholder="1x ESP32-C3&#10;1x TMC2209&#10;2x limit switch&#10;1x TOF sensor&#10;4x M3 bolt&#10;1x GT2 belt">${esc(ui.bom)}</textarea>
    <div class="ebtns" style="margin-top:9px">
      <button class="btn" id="runbom">Check</button>
      <button class="btn ghost" id="clearbom">Clear</button>
    </div>
  </div>${results}`;
}

/* ------------------------------------------------------------------ export */
function toCSV(){
  const head = ["Box","Item","Qty","Note","UpdatedAt"];
  const q = v => /[",\n]/.test(v) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
  const d = new Date(), pad = n => String(n).padStart(2,"0");
  const today = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  const rows = items.filter(i => i.status === "active").map(i => [
    i.box, i.name,
    i.countType === "exact" ? i.qty : (i.countType === "bulk" ? "many" : ""),
    i.note || "", i.edited || i.added ? today : (i.updated ? i.updated.split("-").reverse().join("/") : "")
  ].map(q).join(","));
  return [head.join(","), ...rows].join("\r\n");
}
function download(name, text, mime){
  const b = new Blob([text], {type: mime||"text/plain;charset=utf-8"});
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
  toast("Saved " + name);
}
function parseCSV(text){
  const rows = []; let row = [], cell = "", inQ = false;
  text = text.replace(/^﻿/, "");
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if(c === '"') inQ = true;
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r") cell += c;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

/* ------------------------------------------------------------------ wiring */
function wire(){
  const v = document.getElementById("view");

  v.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; render(); });
  v.querySelectorAll("[data-zone]").forEach(b => b.onclick = () => { ui.zone = b.dataset.zone; render(); });
  v.querySelectorAll("[data-flag]").forEach(b => b.onclick = () => {
    ui.flag = ui.flag === b.dataset.flag ? null : b.dataset.flag; render(); });
  v.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    const c = b.dataset.cat;
    ui.cats.has(c) ? ui.cats.delete(c) : ui.cats.add(c); render(); });
  v.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    ui.open = ui.open === b.dataset.toggle ? null : b.dataset.toggle; render(); });
  v.querySelectorAll("[data-box]").forEach(b => b.onclick = ev => {
    ev.preventDefault(); ui.box = Number(b.dataset.box); ui.tab = "find"; ui.q = ""; ui.flag = null;
    document.getElementById("q").value = ""; render(); });
  v.querySelectorAll("[data-clearbox]").forEach(b => b.onclick = () => { ui.box = null; render(); });
  v.querySelectorAll("[data-onlybox]").forEach(b => b.onclick = () => {
    ui.box = Number(b.dataset.onlybox); ui.open = null; ui.tab = "find"; render(); });
  v.querySelectorAll("[data-add]").forEach(b => b.onclick = addItem);

  const ed = v.querySelector(".editor");
  if(ed){
    const id = ed.closest(".item").dataset.id;
    const get = f => ed.querySelector(`[data-f="${f}"]`);
    ed.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
      const inp = get("qty");
      if(inp.disabled){ toast("Set count type to “exact” first"); return; }
      inp.value = Math.max(0, (Number(inp.value)||0) + Number(b.dataset.step));
    });
    get("countType").onchange = e => { get("qty").disabled = e.target.value !== "exact"; };
    ed.querySelector("[data-savechanges]").onclick = () => {
      const ct = get("countType").value;
      edit(id, {
        qty: ct === "exact" ? (Number(get("qty").value)||0) : null,
        countType: ct,
        box: Math.max(1, Number(get("box").value)||1),
        category: get("category").value,
        name: get("name").value.trim() || "(unnamed)",
        note: get("note").value.trim(),
        updated: new Date().toISOString().slice(0,10),
        conflict: false
      }, "edit");
      ui.open = null; toast("Saved");
    };
    ed.querySelector("[data-del]").onclick = () => {
      if(confirm("Delete this entry from the inventory?")){
        edit(id, {deleted:true}, "delete"); ui.open = null; toast("Deleted");
      }
    };
  }

  const on2 = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  v.querySelectorAll("[data-level]").forEach(b => b.onclick = () => {
    ui.level = Number(b.dataset.level); render(); });
  v.querySelectorAll("[data-cap]").forEach(b => b.onclick = () => {
    ui.cap = Math.min(20, Math.max(2, ui.cap + Number(b.dataset.cap))); render(); });
  on2("applyplan", () => {
    const p = planMoves(ui.level, ui.cap);
    if(!confirm(`Move ${p.moves.length} parts and free ${p.freed.length} boxes?\n\n`
      + `This only changes the app. Print the worksheet first if you want to follow it at the bench.`)) return;
    const today = new Date().toISOString().slice(0,10);
    for(const m of p.moves)
      overlay.edits[m.id] = Object.assign({}, overlay.edits[m.id], {box:m.to, updated:today});
    journal({label:"reorganise", patch:{level:ui.level, moves:p.moves.length}});
    save(); rebuild(); render();
    toast(`Moved ${p.moves.length} parts · ${p.freed.length} boxes free`);
  });
  on2("printplan", () => window.print());

  const bt = document.getElementById("bomtext");
  if(bt){
    document.getElementById("runbom").onclick = () => { ui.bom = bt.value; render(); };
    document.getElementById("clearbom").onclick = () => { ui.bom = ""; render(); };
    bt.onkeydown = e => { if(e.key === "Enter" && (e.ctrlKey||e.metaKey)){ ui.bom = bt.value; render(); } };
  }

  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on("exp-csv",  () => download("box_inventory.csv", toCSV(), "text/csv;charset=utf-8"));
  on("exp-json", () => download("box_inventory_backup.json",
        JSON.stringify({items, overlay, meta:SEED.meta}, null, 2), "application/json"));
  on("exp-log",  () => download("box_inventory_changes.json",
        JSON.stringify(overlay.journal, null, 2), "application/json"));
  on("reset",    () => {
    if(confirm("Discard all local edits and return to the sheet snapshot?")){
      overlay = {edits:{},added:[],journal:[]}; save(); rebuild(); render(); toast("Reset");
    }
  });
  const imp = document.getElementById("imp");
  if(imp) imp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const rows = parseCSV(r.result);
        const head = rows[0].map(h => h.trim().toLowerCase());
        const ix = n => head.indexOf(n);
        if(ix("box") < 0 || ix("item") < 0) throw new Error("need Box and Item columns");
        toast(`Read ${rows.length-1} rows — re-run build.py to rebuild the app from this file`);
      }catch(err){ toast("Could not read: " + err.message); }
    };
    r.readAsText(f);
  };
}

function addItem(){
  const name = prompt("Part name?"); if(!name) return;
  const box = Number(prompt("Which box number?")); if(!box) return;
  const qty = Number(prompt("How many? (blank = uncounted)", "1"));
  const it = {
    id: "new-" + Date.now(), box, name: name.trim(),
    qty: isNaN(qty) ? null : qty, countType: isNaN(qty) ? "unknown" : "exact",
    note: "", category: "misc", updated: new Date().toISOString().slice(0,10),
    conflict:false, restated:false, history:[]
  };
  overlay.added.push(it); journal({id:it.id, label:"add", patch:it});
  save(); rebuild(); ui.box = null; ui.q = ""; ui.open = it.id; render();
  toast("Added to box " + box);
}

/* ------------------------------------------------------------------ camera
   Present only when the page is served by server.py. Opened from file:// there
   is no PC to send the photo to, so the button never appears. */
const SERVED = location.protocol === "http:" || location.protocol === "https:";
let pending = 0;

function setupCamera(){
  if(!SERVED) return;

  const link = document.createElement("link");
  link.rel = "manifest"; link.href = "/manifest.webmanifest";
  document.head.appendChild(link);

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.multiple = true;
  // `capture` opens the camera straight away; removing it shows the gallery.
  // Set as an attribute, not a property — the property does not reflect reliably.
  input.setAttribute("capture", "environment");
  input.style.display = "none";
  document.body.appendChild(input);

  const btn = document.createElement("button");
  btn.id = "cam"; btn.title = "Photograph a part (long-press for gallery)";
  btn.innerHTML = `<span>📷</span>`;
  document.body.appendChild(btn);

  const paint = () => {
    btn.querySelector(".n")?.remove();
    if(pending > 0){
      const n = document.createElement("span");
      n.className = "n"; n.textContent = pending;
      btn.appendChild(n);
    }
  };

  // Tap = camera. Long-press = pick existing shots from the gallery.
  let timer = null, fromGallery = false;
  const arm = () => { fromGallery = false; timer = setTimeout(() => {
    fromGallery = true;
    if(navigator.vibrate) navigator.vibrate(20);
  }, 500); };
  const fire = () => {
    clearTimeout(timer);
    if(fromGallery) input.removeAttribute("capture");
    else input.setAttribute("capture", "environment");
    input.value = "";
    input.click();
  };
  btn.addEventListener("touchstart", arm, {passive:true});
  btn.addEventListener("touchend", fire);
  btn.addEventListener("mousedown", arm);
  btn.addEventListener("mouseup", fire);

  input.onchange = async () => {
    const files = [...input.files];
    if(!files.length) return;
    btn.dataset.busy = "1";
    let sent = 0;
    for(const f of files){
      try{
        const res = await fetch("/upload", {
          method: "POST",
          headers: {"X-Filename": f.name || "photo.jpg",
                    "Content-Type": f.type || "application/octet-stream"},
          body: f,
        });
        const out = await res.json();
        if(!res.ok) throw new Error(out.error || res.status);
        pending = out.pending ?? pending + 1;
        sent++;
      }catch(err){
        toast("Upload failed: " + err.message);
        break;
      }
    }
    delete btn.dataset.busy;
    paint();
    if(sent) toast(`${sent} photo${sent===1?"":"s"} sent · ${pending} waiting`);
  };

  fetch("/inbox").then(r => r.json())
    .then(d => { pending = (d.pending || []).length; paint(); })
    .catch(() => {});
}

/* ------------------------------------------------------------------- boot */
document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("[data-tab]"); if(!b) return;
  ui.tab = b.dataset.tab; ui.open = null; render();
};
const qEl = document.getElementById("q");
qEl.oninput = () => { ui.q = qEl.value; if(ui.q) ui.box = null; render(); };
document.getElementById("clearq").onclick = () => {
  qEl.value = ""; ui.q = ""; ui.box = null; ui.flag = null; qEl.focus(); render(); };
document.getElementById("theme-btn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  next ? document.documentElement.setAttribute("data-theme", next)
       : document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("boxinv.theme", next); }catch(e){}
};
try{
  const t = localStorage.getItem("boxinv.theme");
  if(t) document.documentElement.setAttribute("data-theme", t);
}catch(e){}
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== qEl && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); qEl.focus(); qEl.select();
  }
  if(e.key === "Escape" && document.activeElement === qEl){
    qEl.value = ""; ui.q = ""; render();
  }
});

rebuild();
render();
setupCamera();
</script>
